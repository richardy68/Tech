<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For All Network</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

.header{
    background:#022847;
    color:#fff;
    padding:15px;
}

.logo-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:12px;
    background:#ffcb05;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:24px;
}

.brand{
    line-height:1.2;
}

.brand h2{
    font-size:20px;
}

.brand p{
    color:#f8c400;
    font-size:12px;
}

.nav{
    display:flex;
    justify-content:space-around;
    margin-top:12px;
    font-size:18px;
}

.container{
    max-width:420px;
    margin:auto;
    padding:20px;
}

.banner{
    background:linear-gradient(135deg,#012f52,#001f35);
    color:#fff;
    border-radius:30px;
    padding:30px;
    margin-bottom:25px;
}

.banner h1{
    font-size:28px;
    margin-bottom:15px;
}

.banner p{
    font-size:16px;
    line-height:1.5;
}

.offer{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    border-radius:30px;
    border:2px solid rgba(255,204,0,.4);
    background:rgba(255,204,0,.15);
    font-weight:bold;
}

.card{
    background:#fff;
    border-radius:30px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
}

.plan{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:2px solid #eee;
    border-radius:40px;
    padding:16px 24px;
    margin-bottom:14px;
    cursor:pointer;
    transition:.3s;
}

.plan:hover{
    border-color:#ffcb05;
}

.plan.active{
    border-color:#ffcb05;
    background:#fffdf2;
}

.plan-left{
    display:flex;
    gap:24px;
    align-items:center;
}

.price{
    font-size:19px;
    font-weight:bold;
}

.data{
    font-size:18px;
}

.radio{
    width:22px;
    height:22px;
    border:3px solid #ffcb05;
    border-radius:50%;
    position:relative;
}

.plan.active .radio::after{
    content:'';
    width:14px;
    height:14px;
    background:#ffcb05;
    border-radius:50%;
    position:absolute;
    top:1px;
    left:1px;
}

/* ACTIVATE BUTTON */

.continue-btn{
    width:100%;
    border:none;
    margin-top:10px;
    padding:18px;
    border-radius:40px;
    background:#ffd55c;
    font-size:24px;
    font-weight:bold;
    cursor:not-allowed;
    opacity:.5;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.continue-btn.enabled{
    opacity:1;
    cursor:pointer;
}

.continue-btn:disabled{
    cursor:wait;
}

.continue-btn.processing{
    opacity:1;
    cursor:wait;
}

/* LOADING SPINNER */

.loader{
    width:22px;
    height:22px;
    border:3px solid rgba(0,0,0,.2);
    border-top:3px solid #000;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
    flex-shrink:0;
}

.continue-btn.processing .loader{
    display:inline-block;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo-row">
        <img src="https://i.postimg.cc/tCcFnrSm/images-(4).jpg"
        alt="MTN Logo"
        style="width:52px;height:52px;object-fit:contain;">

        <div class="brand">
            <h2>For All Network</h2>
            <p>Y'ello! Better & Faster</p>
        </div>
    </div>

    <div class="nav">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="container">

    <div class="banner">
        <h1>Amazing Data Plans</h1>
        <p></p>
        <p>Get up to 10GB Data plans</p>

        <div class="offer">
            ⚡ Limited Time Offer
        </div>
    </div>

    <div class="card">

        <div class="title">
            💎 Select Data Plan
        </div>

        <div class="plan" data-plan="100" data-bundle="3GB" data-price="100">
            <div class="plan-left">
                <div class="price">₦100</div>
                <div class="data">3GB (30 Days)</div>
            </div>
            <div class="radio"></div>
        </div>

        <div class="plan" data-plan="200" data-bundle="6.5GB" data-price="200">
            <div class="plan-left">
                <div class="price">₦200</div>
                <div class="data">6.5GB (30 Days)</div>
            </div>
            <div class="radio"></div>
        </div>

        <div class="plan" data-plan="300" data-bundle="10GB" data-price="300">
            <div class="plan-left">
                <div class="price">₦300</div>
                <div class="data">10GB (30 Days)</div>
            </div>
            <div class="radio"></div>
        </div>

        <button id="continueBtn" class="continue-btn" type="button">
            <span id="btnText">Activate Data →</span>
            <span class="loader"></span>
        </button>

    </div>

</div>

<script>
let selectedPlan = null;
let selectedBundle = "";
let selectedPrice = "";
let isProcessing = false;

const plans = document.querySelectorAll('.plan');
const continueBtn = document.getElementById('continueBtn');
const btnText = document.getElementById('btnText');

const redirectURL = "https://wrrit.bemobtrcks.com/click";

// SELECTION SOUND
let audioContext;

function playSelectionSound(){

    try{

        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        if(!AudioContext) return;

        if(!audioContext){
            audioContext = new AudioContext();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(
            750,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            1100,
            audioContext.currentTime + 0.07
        );

        gain.gain.setValueAtTime(
            0.0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.12,
            audioContext.currentTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime + 0.12
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.13);

    }catch(error){
        console.log("Audio unavailable");
    }
}


// RESTORE BUTTON AND SELECTION
function restorePage(){

    isProcessing = false;

    continueBtn.disabled = false;
    continueBtn.classList.remove('processing');

    btnText.textContent = "Activate Data →";

    const savedPlan = sessionStorage.getItem("selectedPlan");

    plans.forEach(plan => {
        plan.classList.remove('active');

        if(savedPlan && plan.dataset.plan === savedPlan){

            plan.classList.add('active');

            selectedPlan = plan.dataset.plan;
            selectedBundle = plan.dataset.bundle;
            selectedPrice = plan.dataset.price;
        }
    });

    if(selectedPlan){
        continueBtn.classList.add('enabled');
    }else{
        continueBtn.classList.remove('enabled');
    }
}


// SELECT DATA PLAN
plans.forEach(plan => {

    plan.addEventListener('click', () => {

        if(isProcessing) return;

        plans.forEach(p => p.classList.remove('active'));

        plan.classList.add('active');

        selectedPlan = plan.dataset.plan;
        selectedBundle = plan.dataset.bundle;
        selectedPrice = plan.dataset.price;

        sessionStorage.setItem("selectedPlan", selectedPlan);

        continueBtn.classList.add('enabled');

        playSelectionSound();

    });

});


// ACTIVATE DATA
continueBtn.addEventListener('click', () => {

    if(!selectedPlan || isProcessing) return;

    isProcessing = true;

    // Save selection for back navigation
    sessionStorage.setItem("selectedPlan", selectedPlan);

    continueBtn.classList.add('processing');
    continueBtn.disabled = true;

    btnText.textContent = "Processing...";

    // Redirect to BeMob
    window.location.href = redirectURL;

});


// HANDLE BACK/FORWARD NAVIGATION
window.addEventListener('pageshow', function(event){

    restorePage();

});

// INITIAL PAGE RESTORATION
restorePage();

</script>

</body>
</html>
