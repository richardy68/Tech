<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoplay Voice Test</title>
<style>
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#101827;
  font-family:Arial,sans-serif;
  color:white;
}
.card {
  width:85%;
  max-width:380px;
  padding:30px 20px;
  text-align:center;
  background:#1d293b;
  border-radius:18px;
}
button {
  padding:14px;
  width:100%;
  border:0;
  border-radius:9px;
  margin-top:12px;
  background:#16a36a;
  color:white;
  font-weight:bold;
}
#status {color:#aebbd0;font-size:13px;margin-top:18px}
</style>
</head>
<body>

<div class="card">
  <div style="font-size:50px">🔊</div>
  <h2>Welcome!</h2>
  <p>Testing automatic AI voice playback.</p>

  <button onclick="startVoice()">Play Voice</button>
  <button onclick="stopVoice()" style="background:#444">Stop</button>

  <div id="status">Attempting automatic playback...</div>
</div>

<script>
const message =
"Hello! Welcome to our page. Thanks for visiting. We're happy to have you here!";

let played = false;
let voicesReady = false;

function startVoice() {
  if (!window.speechSynthesis) {
    statusText("Speech is not supported.");
    return;
  }

  if (played) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "en-US";
  speech.rate = 0.95;
  speech.pitch = 1;
  speech.volume = 1;

  speech.onstart = () => {
    played = true;
    statusText("Voice is playing!");
  };

  speech.onend = () => {
    statusText("Voice completed.");
  };

  speech.onerror = () => {
    statusText("Autoplay blocked. Tap Play Voice.");
  };

  speechSynthesis.speak(speech);
}

function statusText(text) {
  document.getElementById("status").textContent = text;
}

function stopVoice() {
  speechSynthesis.cancel();
  played = false;
  statusText("Voice stopped.");
}

function attemptAutoplay() {
  if (!played) startVoice();
}

if (window.speechSynthesis) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => {
    voicesReady = true;
  };
}

attemptAutoplay();

window.addEventListener("load", attemptAutoplay);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !played) attemptAutoplay();
});
</script>

</body>
</html>
