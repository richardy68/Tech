
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For All Network</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

.header{
    background:#022847;
    color:#fff;
    padding:15px;
}

.logo-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:12px;
    background:#ffcb05;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:24px;
}

.brand{
    line-height:1.2;
}

.brand h2{
    font-size:20px;
}

.brand p{
    color:#f8c400;
    font-size:12px;
}

.nav{
    display:flex;
    justify-content:space-around;
    margin-top:12px;
    font-size:18px;
}

.container{
    max-width:420px;
    margin:auto;
    padding:20px;
}

.banner{
    background:linear-gradient(135deg,#012f52,#001f35);
    color:#fff;
    border-radius:30px;
    padding:30px;
    margin-bottom:25px;
}

.banner h1{
    font-size:28px;
    margin-bottom:15px;
}

.banner p{
    font-size:16px;
    line-height:1.5;
}

.offer{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    border-radius:30px;
    border:2px solid rgba(255,204,0,.4);
    background:rgba(255,204,0,.15);
    font-weight:bold;
}

.card{
    background:#fff;
    border-radius:30px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
}

/* DATA PLAN LAYOUT */

.plan{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:2px solid #eee;
    border-radius:40px;
    padding:16px 14px;
    margin-bottom:14px;
    cursor:pointer;
    transition:.3s;
    width:100%;
    min-width:0;
}

.plan:hover{
    border-color:#ffcb05;
}

.plan.active{
    border-color:#ffcb05;
    background:#fffdf2;
}

.plan-left{
    display:flex;
    align-items:center;
    gap:clamp(10px,3vw,20px);
    flex:1;
    min-width:0;
}

.price{
    font-size:clamp(16px,4.5vw,19px);
    font-weight:bold;
    white-space:nowrap;
    flex-shrink:0;
    width:78px;
    text-align:left;
}

.data{
    font-size:clamp(14px,4.2vw,18px);
    white-space:nowrap;
    flex:1;
    min-width:0;
}

.radio{
    width:22px;
    height:22px;
    border:3px solid #ffcb05;
    border-radius:50%;
    position:relative;
    flex-shrink:0;
    margin-left:8px;
}

.plan.active .radio::after{
    content:'';
    width:14px;
    height:14px;
    background:#ffcb05;
    border-radius:50%;
    position:absolute;
    top:1px;
    left:1px;
}

/* CONTINUE BUTTON */

.continue-btn{
    width:100%;
    border:none;
    margin-top:10px;
    padding:18px;
    border-radius:40px;
    background:#ffd55c;
    font-size:24px;
    font-weight:bold;
    cursor:not-allowed;
    opacity:.5;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.continue-btn.enabled{
    opacity:1;
    cursor:pointer;
}

.continue-btn:disabled{
    cursor:not-allowed;
}

/* LOADING SPINNER */

.spinner{
    width:23px;
    height:23px;
    border:3px solid rgba(0,0,0,.2);
    border-top:3px solid #000;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
    flex-shrink:0;
}

.continue-btn.processing .spinner{
    display:inline-block;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="logo-row">
        <img src="https://i.postimg.cc/tCcFnrSm/images-(4).jpg"
             alt="MTN Logo"
             style="width:52px;height:52px;object-fit:contain;">

        <div class="brand">
            <h2>For All Network</h2>
            <p>Y'ello! Better & Faster</p>
        </div>
    </div>

    <div class="nav">
        <span>Home</span>
        <span>Share Data</span>
        <span>5G Network</span>
    </div>
</div>

<div class="container">

    <div class="banner">
        <h1>Amazing Data Plans</h1>
        <p></p>
        <p>Get up to 10GB Data plans</p>

        <div class="offer">
            ⚡ Limited Time Offer
        </div>
    </div>

    <div class="card">

        <div class="title">
            💎 Select Data Plan
        </div>

        <div class="plan"
             data-plan="100"
             data-bundle="3GB"
             data-price="100">

            <div class="plan-left">
                <div class="price">₦100</div>
                <div class="data">3GB (30 Days)</div>
            </div>

            <div class="radio"></div>
        </div>

        <div class="plan"
             data-plan="200"
             data-bundle="6.5GB"
             data-price="150">

            <div class="plan-left">
                <div class="price">₦150</div>
                <div class="data">6.5GB (30Days)</div>
            </div>

            <div class="radio"></div>
        </div>

        <button id="continueBtn" class="continue-btn" disabled>
            <span id="buttonText">Continue →</span>
            <span class="spinner"></span>
        </button>

    </div>

</div>

<script>

let selectedPlan = null;
let selectedBundle = "";
let selectedPrice = "";
let isProcessing = false;

const plans = document.querySelectorAll('.plan');
const continueBtn = document.getElementById('continueBtn');
const buttonText = document.getElementById('buttonText');


/* PLAN SELECTION */

plans.forEach(plan => {

    plan.addEventListener('click', () => {

        if(isProcessing) return;

        plans.forEach(p => p.classList.remove('active'));

        plan.classList.add('active');

        selectedPlan = plan.dataset.plan;
        selectedBundle = plan.dataset.bundle;
        selectedPrice = plan.dataset.price;

        continueBtn.classList.add('enabled');
        continueBtn.disabled = false;

    });

});


/* BUTTON CLICK SOUND */

function playButtonSound(){

    try{

        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        if(!AudioContext) return;

        const audio = new AudioContext();

        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            650,
            audio.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            420,
            audio.currentTime + 0.09
        );

        gain.gain.setValueAtTime(
            0.18,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + 0.12
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(audio.currentTime + 0.12);

        oscillator.onended = () => {
            audio.close();
        };

    }catch(error){

        console.log("Sound unavailable:", error);

    }

}


/* CONTINUE BUTTON */

continueBtn.addEventListener('click', () => {

    if(!selectedPlan || isProcessing) return;

    isProcessing = true;

    // Play sound immediately after user click
    playButtonSound();

    // Change button appearance
    continueBtn.classList.add('processing');
    continueBtn.disabled = true;

    // Change text
    buttonText.textContent = "Processing";

    // Wait 3 seconds before redirecting
    setTimeout(() => {

        window.location.href =
            "Revshare.html?bundle=" +
            encodeURIComponent(selectedBundle) +
            "&price=" +
            encodeURIComponent(selectedPrice);

    }, 3000);

});

</script>

</body>
</html>
